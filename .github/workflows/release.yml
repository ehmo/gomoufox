name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for manual retries
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate-public-release:
    if: github.repository == 'ehmo/gomoufox'
    runs-on: ubicloud-standard-2
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bad tag: $tag" >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout tag
        if: github.event_name == 'workflow_dispatch'
        run: git checkout --detach "refs/tags/${{ steps.tag.outputs.tag }}"
      - name: Public contract
        run: python3 scripts/check-public-release-contract.py .
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Docs number format
        run: python3 scripts/format-doc-numbers.py
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Managed runtime launch
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/runtime-launch-gate.sh --venv-dir "${{ runner.temp }}/gomoufox-runtime-cache"
      - name: Agent contracts
        run: python3 scripts/check-agent-contracts.py
      - name: Vet
        run: go vet ./...
      - name: Coverage
        run: |
          coverage_min="100.0"
          profile="$(mktemp "${TMPDIR:-/tmp}/gomoufox-coverage.XXXXXX")"
          go test -count=1 -coverprofile="$profile" ./...
          python3 scripts/check-go-coverage.py --profile "$profile" --min "$coverage_min"
          rm -f "$profile"
      - name: Vulnerability check
        run: GOTOOLCHAIN="$(go env GOVERSION)" go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - name: Build artifacts
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          out="dist/release/$tag"
          python3 scripts/package-release.py --version "$tag" --out "$out" --verify-formula Formula/gomoufox.rb
          "$out/gomoufox" --version
          "$out/gomoufox-realpass" --version
      - name: Release notes
        run: |
          awk -v tag="${{ steps.tag.outputs.tag }}" '$0 == "## " tag {flag=1; next} /^## /{if(flag) exit} flag {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Build container candidate
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          docker build \
            --build-arg "VERSION=$tag" \
            --tag "gomoufox:$tag" \
            .
      - name: Container daemon smoke
        env:
          GOMOUFOX_CONTAINER_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          image="gomoufox:$GOMOUFOX_CONTAINER_TAG"
          client="dist/release/$GOMOUFOX_CONTAINER_TAG/gomoufox"
          test "$(docker run --rm "$image" --version)" = "gomoufox $GOMOUFOX_CONTAINER_TAG"
          docker run --rm "$image" doctor
          container_id="$(docker run --detach --rm --init \
            --publish 127.0.0.1::3741 \
            --env GOMOUFOX_DAEMON_TOKEN=container-smoke-token \
            "$image")"
          cleanup() {
            docker logs "$container_id" 2>&1 || true
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          address="$(docker port "$container_id" 3741/tcp)"
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer container-smoke-token" \
              "http://$address/v1/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          GOMOUFOX_DAEMON_TOKEN=container-smoke-token \
            "$client" --server "http://$address" \
            get https://example.com --text > /tmp/gomoufox-container-page.txt
          grep -q "Example Domain" /tmp/gomoufox-container-page.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gomoufox-${{ steps.tag.outputs.tag }}-candidate
          path: |
            dist/release/${{ steps.tag.outputs.tag }}/*.tar.gz
            dist/release/${{ steps.tag.outputs.tag }}/checksums.txt
            dist/release/${{ steps.tag.outputs.tag }}/checksums.json
            dist/release/${{ steps.tag.outputs.tag }}/release-provenance.json
            dist/release/${{ steps.tag.outputs.tag }}/sbom.spdx.json
            Formula/gomoufox.rb
            release-notes.md
          if-no-files-found: error

  publish-public-release:
    if: github.repository == 'ehmo/gomoufox'
    needs: gate-public-release
    runs-on: ubicloud-standard-2
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Checkout tag
        run: git checkout --detach "refs/tags/${{ needs.gate-public-release.outputs.tag }}"
      - name: Download release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.gate-public-release.outputs.tag }}"
          rm -f Formula/gomoufox.rb release-notes.md
          rm -rf "dist/release/$tag"
          gh run download "${{ github.run_id }}" \
            --name "gomoufox-${tag}-candidate" \
            --dir .
          test -s release-notes.md
          test -f "dist/release/$tag/checksums.json"
          test -f "dist/release/$tag/sbom.spdx.json"
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            dist/release/${{ needs.gate-public-release.outputs.tag }}/*.tar.gz
            dist/release/${{ needs.gate-public-release.outputs.tag }}/checksums.txt
            dist/release/${{ needs.gate-public-release.outputs.tag }}/checksums.json
            dist/release/${{ needs.gate-public-release.outputs.tag }}/release-provenance.json
            dist/release/${{ needs.gate-public-release.outputs.tag }}/sbom.spdx.json
            Formula/gomoufox.rb
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/release/${{ needs.gate-public-release.outputs.tag }}/*.tar.gz
          sbom-path: dist/release/${{ needs.gate-public-release.outputs.tag }}/sbom.spdx.json
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.gate-public-release.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/release/${{ needs.gate-public-release.outputs.tag }}/*.tar.gz
            dist/release/${{ needs.gate-public-release.outputs.tag }}/checksums.txt
            dist/release/${{ needs.gate-public-release.outputs.tag }}/checksums.json
            dist/release/${{ needs.gate-public-release.outputs.tag }}/release-provenance.json
            dist/release/${{ needs.gate-public-release.outputs.tag }}/sbom.spdx.json
            Formula/gomoufox.rb
      - name: Post-release public audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.gate-public-release.outputs.tag }}"
          python3 scripts/audit-public-release.py \
            --version "$tag" \
            --repo ehmo/gomoufox \
            --verify-attestations \
            --brew-mode inspect \
            --json-out "dist/release/$tag/public-audit.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: gomoufox-${{ needs.gate-public-release.outputs.tag }}-public-audit
          path: dist/release/${{ needs.gate-public-release.outputs.tag }}/public-audit.json
          if-no-files-found: error

  publish-container:
    if: github.repository == 'ehmo/gomoufox'
    needs:
      - gate-public-release
      - publish-public-release
    runs-on: ubicloud-standard-2
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Checkout tag
        run: git checkout --detach "refs/tags/${{ needs.gate-public-release.outputs.tag }}"
      - name: Resolve container tags
        id: container
        run: |
          tag="${{ needs.gate-public-release.outputs.tag }}"
          version="${tag#v}"
          latest="$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print; exit}')"
          test -n "$latest"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${{ github.repository }}:$tag"
            echo "ghcr.io/${{ github.repository }}:$version"
            if [ "$tag" = "$latest" ]; then
              echo "ghcr.io/${{ github.repository }}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and publish container
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.container.outputs.tags }}
          build-args: VERSION=${{ needs.gate-public-release.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Verify public container digest
        env:
          GOMOUFOX_CONTAINER_TAG: ${{ needs.gate-public-release.outputs.tag }}
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
          echo "Container digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          docker pull "$image"
          test "$(docker run --rm "$image" --version)" = "gomoufox $GOMOUFOX_CONTAINER_TAG"
          docker run --rm "$image" doctor
          daemon_id="$(docker run --detach --rm --init \
            --env GOMOUFOX_DAEMON_TOKEN=container-smoke-token \
            "$image")"
          cleanup() {
            docker logs "$daemon_id" 2>&1 || true
            docker stop "$daemon_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for _ in {1..30}; do
            if docker run --rm \
              --network "container:$daemon_id" \
              --entrypoint /bin/bash \
              "$image" \
              -c 'curl --fail --silent --show-error \
                --header "Authorization: Bearer container-smoke-token" \
                http://127.0.0.1:3741/v1/health >/dev/null'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker run --rm \
            --network "container:$daemon_id" \
            --env GOMOUFOX_DAEMON_TOKEN=container-smoke-token \
            "$image" \
            --server http://127.0.0.1:3741 \
            get https://example.com --text > /tmp/gomoufox-published-container-page.txt
          grep -q "Example Domain" /tmp/gomoufox-published-container-page.txt
