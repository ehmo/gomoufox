name: ci

on:
  schedule:
    - cron: "43 7 * * *"
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: Run the Go/Python resource benchmark
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      benchmark_mode:
        description: benchmark target tier
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - extended
      benchmark_loops:
        description: benchmark loop count
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-launch:
    if: github.event_name == 'schedule'
    runs-on: ubicloud-standard-2
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve runtime cache policy
        id: runtime
        run: |
          camoufox_version="$(sed -n 's/^[[:space:]]*CamoufoxBinaryVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/sidecar/types.go)"
          playwright_version="$(sed -n 's/^[[:space:]]*RequiredPlaywrightJSON[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' internal/sidecar/types.go)"
          schema_version="$(sed -n 's/^[[:space:]]*runtimeAssetManifestSchemaVersion[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' internal/sidecar/runtime_assets.go)"
          test -n "$camoufox_version"
          test -n "$playwright_version"
          test -n "$schema_version"
          uncached="false"
          if [ "$(date -u +%u)" = "1" ]; then
            uncached="true"
          fi
          {
            printf 'camoufox_version=%s\n' "$camoufox_version"
            printf 'playwright_version=%s\n' "$playwright_version"
            printf 'schema_version=%s\n' "$schema_version"
            printf 'uncached=%s\n' "$uncached"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.runtime.outputs.uncached != 'true'
        with:
          path: ${{ runner.temp }}/gomoufox-runtime-cache/runtime
          key: gomoufox-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.camoufox_version }}-${{ steps.runtime.outputs.playwright_version }}-schema-${{ steps.runtime.outputs.schema_version }}
      - name: Clear runtime cache for weekly cold install
        if: steps.runtime.outputs.uncached == 'true'
        run: |
          case "$RUNNER_TEMP" in
            ""|"/") echo "unsafe RUNNER_TEMP: $RUNNER_TEMP" >&2; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/gomoufox-runtime-cache"
      - name: Install and launch managed browser
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/runtime-launch-gate.sh --venv-dir "${{ runner.temp }}/gomoufox-runtime-cache"

  python-compat:
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Audit script parses on Python 3.9
        run: |
          python3 scripts/audit-public-release.py --help >/dev/null
          PYTHON_BIN=python3 go test -count=1 . -run TestAuditPublicReleaseRetriesTransientBrewInstallFailure

  fast-gate:
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Public contract
        run: python3 scripts/check-public-release-contract.py .
      - name: Docs number format
        run: python3 scripts/format-doc-numbers.py
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Agent contracts
        run: python3 scripts/check-agent-contracts.py
      - name: Vet
        run: go vet ./...
      - name: Public consumer canary plan
        run: bash scripts/public-consumer-canary.sh --version latest --repo ehmo/gomoufox --dry-run

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark == 'true'
    runs-on: ubicloud-standard-2
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install managed Camoufox stack
        run: |
          go run ./cmd/gomoufox install
          go run ./cmd/gomoufox install --runtime python
      - name: Benchmark Go versus Python
        env:
          BENCHMARK_LOOPS: ${{ inputs.benchmark_loops }}
        run: |
          case "$BENCHMARK_LOOPS" in
            ""|*[!0-9]*|0*) echo "benchmark_loops must be a positive integer" >&2; exit 2 ;;
          esac
          if [ "$BENCHMARK_LOOPS" -gt 3 ]; then
            echo "benchmark_loops must be 1, 2, or 3" >&2
            exit 2
          fi
          scripts/benchmark-realpass.py --mode "${{ inputs.benchmark_mode }}" --loops "$BENCHMARK_LOOPS" --out "dist/benchmarks/ci-${{ github.run_id }}"
          {
            echo "### gomoufox benchmark"
            echo
            echo "- Mode: ${{ inputs.benchmark_mode }}"
            echo "- Loops: $BENCHMARK_LOOPS"
            echo "- Artifact: benchmark-${{ inputs.benchmark_mode }}-${BENCHMARK_LOOPS}x-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: benchmark-${{ inputs.benchmark_mode }}-${{ inputs.benchmark_loops }}x-${{ github.run_id }}
          path: dist/benchmarks/ci-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30
